<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPDSE Cell Metaphor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage">
  <header id="title">
    <a id="logo" href="https://cpdse.dk" target="_blank" rel="noopener" aria-label="CPDSE website"><img src="logo_wide_gold.png" alt="Center for Pharmaceutical Data Science Education"></a>
    <h1>CPDSE Cell Metaphor</h1>
    <p>Click an area to learn more</p>
  </header>
  <div id="figure">
    <div id="paper"><img id="cell" src="cell.png" alt="Cell metaphor overview" draggable="false"></div>
    <div id="hotspots">
      <svg id="glow" preserveAspectRatio="none"></svg>
      <svg id="areas" preserveAspectRatio="none"></svg>
    </div>
  </div>
</main>

<aside id="popup" aria-hidden="true">
  <div id="popup-nav">
    <button id="prev" aria-label="Previous element">&#8249;</button>
    <button id="next" aria-label="Next element">&#8250;</button>
    <button id="close" aria-label="Close">&times;</button>
  </div>
  <h2 id="popup-title"></h2>
  <div id="popup-body"></div>
</aside>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
